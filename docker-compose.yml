# Local development services. Production adds web, api and caddy (Phase 6).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reactive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reactive}
      POSTGRES_DB: ${POSTGRES_DB:-reactive_store}
    ports:
      # Bound to localhost only, never exposed on the network.
      # Host port 5433 by default so it does not clash with a native Postgres on 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
