name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: Lint, type-check, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Builds packages/shared first, then checks every workspace.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
